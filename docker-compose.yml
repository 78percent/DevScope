services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devscope-postgres
    environment:
      POSTGRES_DB: devscope
      POSTGRES_USER: devscope
      POSTGRES_PASSWORD: devscope
    ports:
      # Windows 已有 PostgreSQL 占用 5432，DevScope 固定使用 5433 避免冲突。
      - "5433:5432"
    volumes:
      - devscope_postgres_data:/var/lib/postgresql/data
      - ./packages/db/drizzle/0000_day1.sql:/docker-entrypoint-initdb.d/0000_day1.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devscope -d devscope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devscope_postgres_data:
